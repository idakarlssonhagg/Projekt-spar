<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPÅR</title>

    <link rel="stylesheet" href="style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <!-- Marquee -->
      <div class="marquee">
        <div class="marquee-content">
          <p>Registrera dig på vårt nyhetsbrev och få 30% på ditt första köp.</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="main-header">
        <!-- Logo -->
        <a href="index.html" class="logo">
          <img src="Images/LOGOTYP VIT_ORANGE.png" alt="Spår" />
        </a>

        <!-- Hamburger menu -->
        <img
          class="hamburger-menu"
          src="Images/header/Hamburger-menu-white.svg"
          alt="Meny"
        />

        <!-- Navigation links -->
        <ul class="nav-links">
          <li><a href="#">Nytt</a></li>
          <li><a href="#">Herr</a></li>
          <li><a href="#">Dam</a></li>
          <li><a href="#">Skor</a></li>
          <li><a href="#">Accessoarer</a></li>
        </ul>

        <!-- Icons -->
        <div class="header-icons">
          <div class="icon">
            <img src="Images/icons/magnifyingGlass.png" alt="" />
          </div>

          <div class="icon">
            <img src="Images/icons/user.png" alt="" />
          </div>

          <div class="icon">
            <img src="Images/icons/shoppingBag.png" alt="" />
          </div>
        </div>
      </nav>
    </header>

    <main>
        <picture class="hero">
            <!-- Mobilbild -->
             <source
             srcset="Images/main/Mobile-hero.png"
             media="(max-width: 768px)"
             />

             <!-- Desktopbild -->
              <img
              src="Images/main/COOL BILD.png"
              alt="Spår - upptäck naturen"
              />
        </picture>

      <img
        class="mobileImages"
        src="Images/main/Nyhetsbild-1.png"
        alt=""
      />

      <section class="product-selection">
        <div class="product-heading">
            <h2>Utforska kommande produkter</h2>
            <a href="#">Join the waitlist </a> <!-- Lägg till knapp eller bild på knapp -->
        </div>

        <div class="product-carousel">

            <article class="product-card">
                <img src="Images/1BILD.png" alt="Produkt 1" />
                <h3>-PRODUKTNAMN</h3>
            </article>

            <article class="product-card">
                <img src="Images/2BILD.png" alt="Produkt 2" />
                <h3>-PRODUKTNAMN</h3>
            </article>

            <article class="product-card">
                <img src="Images/3BILD.png" alt="Produkt 3" />
                <h3>-PRODUKTNAMN</h3>
            </article>

            <article class="product-card">
                <img src="Images/4BILD.png" alt="Produkt 4" />
                <h3>-PRODUKTNAMN</h3>
            </article>

            <article class="product-card">
                <img src="Images/5BILD.png" alt="Produkt 5" />
                <h3>-PRODUKTNAMN</h3>
            </article>

        </div>
      </section>

    
    </main>
  </body>
</html>
